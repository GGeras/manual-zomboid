# Site público (site/): testa e builda em todo PR; publica no Cloudflare Workers a cada push na main.
# Segredos (os mesmos da Central): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Chaves públicas: site/config.publico.json.
name: site
on:
  push:
    branches: [main]
    paths: ['site/**', 'info-validada/**', 'roteiros/**', 'projeto/pipeline/fatos.json', 'projeto/assets/logo/**', 'projeto/assets/moodles/**', 'projeto/assets/items/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'info-validada/**', 'roteiros/**', 'projeto/pipeline/fatos.json', '.github/workflows/site.yml']
  workflow_dispatch:
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
        env:
          GIT_LFS_SKIP_SMUDGE: '1' # não baixa o LFS inteiro (cota)
        with:
          lfs: false
      # só a lista curada de assets.json sai do LFS (+ cache): arquitetura.md §5
      - name: Lista curada do LFS
        id: lfs
        run: |
          node -e "const a=require('./assets.json');const p=[...Object.values(a.logos).map(x=>x.de),...a.moodles.map(m=>'projeto/assets/moodles/'+m+'.png'),...a.itens.map(i=>'projeto/assets/items/'+i+'.png'),...Object.values(a.cenas).map(x=>x.de),...(a.modelos||[]),...(a.capas?[a.capas+'/*.jpg']:[])];console.log('include='+p.join(','))" >> "$GITHUB_OUTPUT"
          echo "chave=$(sha1sum assets.json | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-site-${{ steps.lfs.outputs.chave }}
      - name: Baixar só esses arquivos
        working-directory: .
        run: git lfs pull --include="${{ steps.lfs.outputs.include }}"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run config
      - run: npm test
      - name: Build (trava de fatos + Next + Worker)
        run: npx opennextjs-cloudflare build
        env:
          CI: '1'
      - name: Publicar no Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::Sem CLOUDFLARE_API_TOKEN: publicação pulada"; exit 0; fi
          npx opennextjs-cloudflare deploy
