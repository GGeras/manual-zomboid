# Central (plataforma/app): testa e builda em todo PR; publica no Cloudflare a cada push na main.
# Segredos (GitHub > Settings > Secrets and variables > Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: central
on:
  push:
    branches: [main]
    paths: ['plataforma/app/**', '.github/workflows/central.yml']
  pull_request:
    paths: ['plataforma/app/**', '.github/workflows/central.yml']
  workflow_dispatch:
concurrency:
  group: central-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plataforma/app
    steps:
      - uses: actions/checkout@v5
        env:
          GIT_LFS_SKIP_SMUDGE: '1' # não gasta a cota do LFS
        with:
          lfs: false
          sparse-checkout: plataforma/app
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plataforma/app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publicar no Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::Sem CLOUDFLARE_API_TOKEN: publicação pulada (plataforma/README.md)"; exit 0; fi
          npx wrangler deploy
